
<!DOCTYPE html>

<body>

    <div class="bookContainer">

        <!-- כפתור אחורה -->
        <img id="prevBtn"
             class="navBtn prevBtn"
             src="assets/Group 97.png"
             alt="הקודם">

        <!-- תוכן הספר -->
        <div class="page">

            <img id="photoContent" class="media" style="display:none;">

            <video id="videoContent"
                   class="media"
                   controls
                   style="display:none;">
            </video>

        </div>

        <!-- כפתור קדימה -->
        <img id="nextBtn"
             class="navBtn nextBtn"
             src="assets/Group 98.png"
             alt="הבא">

    </div>

    <script src="script.js"></script>


</body>
<style>

            background-image: url("assets/iPhone\ 17\ -\ 2.png");

</style>

const video = document.getElementById("videoContent");

];
// עמוד נוכחי
let currentPage = 0;

// פונקציה להצגת עמוד
function showPage() {

    const page = pages[currentPage];

    // מסתירים הכל קודם
    photo.style.display = "none";
    video.style.display = "none";

    // עוצרים וידאו אם היה פעיל
    video.pause();
    video.currentTime = 0;
    video.removeAttribute("src");

    // מציגים לפי סוג
    if (page.type === "image") {

        photo.src = page.src;
        photo.style.display = "block";

    } else if (page.type === "video") {

    video.pause();
    video.currentTime = 0;

    video.src = page.src;
    video.load();

    video.style.display = "block";
}

    // כפתור אחורה בעמוד ראשון
    if (currentPage === 0) {
        prevBtn.classList.add("hidden");
    } else {
        prevBtn.classList.remove("hidden");
    }

    // כפתור קדימה בעמוד אחרון
    if (currentPage === pages.length - 1) {
        nextBtn.classList.add("hidden");
    } else {
        nextBtn.classList.remove("hidden");
    }
    
}

// קדימה
nextBtn.addEventListener("click", () => {

    if (currentPage < pages.length - 1) {
        currentPage++;
        showPage();
    }
});

// אחורה
prevBtn.addEventListener("click", () => {

    if (currentPage > 0) {
        currentPage--;
        showPage();
    }
});

// טעינה ראשונית
showPage();
</script>
